[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-swing-cycle-tracker"
version = "0.1.0"
description = "Track BTC price action, detect swing highs and lows, and analyze cycles"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Stock Cycle Tracker Contributors", email = "dev@btc-cycle-tracker.example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.17.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "streamlit>=1.28.0",
    "python-dateutil>=2.8.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
stock-cycle-tracker = "stock_cycle_tracker.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_cycle_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# typer's decorator idiom legitimately calls Option() in defaults
"src/stock_cycle_tracker/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
